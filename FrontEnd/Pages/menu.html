<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | MultiCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/menu.css">
</head>
<body class="sem-circuito-esquerda">
    <div class="pagina">
        <header class="topo">
            <a class="marca" href="menu.html"><img src="../../assets/logo-icone.svg" alt=""><span class="marca-texto">Multi<span>Core</span></span></a>
            <div class="topo-acoes">
                <span class="usuario"><span class="avatar" id="avatar" aria-hidden="true"></span><span id="usuario-nome"></span></span>
                <button type="button" class="btn btn-secundario btn-pequeno" id="btn-sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M15 12H4M8 8l-4 4 4 4"/></svg>
                    Sair
                </button>
            </div>
        </header>

        <main>
            <h1 class="titulo-pagina saudacao">Olá<span id="saudacao-separador"></span><span class="destaque" id="saudacao-nome"></span>!</h1>
            <p class="texto-suave subtitulo">Escolha uma das opções abaixo.</p>

            <div class="opcoes">
                <a class="card opcao" href="questao.html" id="opcao-exames">
                    <span class="icone-caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M10 6h11M10 12h11M10 18h11"/></svg></span>
                    <h2>Exames</h2>
                    <p id="exames-descricao">Realize a certificação tema por tema.</p>
                    <span class="link-seta"><span id="exames-acao">Começar exame</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
                    <svg class="opcao-marca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M10 6h11M10 12h11M10 18h11"/></svg>
                </a>

                <a class="card opcao" href="area-estudos.html">
                    <span class="icone-caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.3 4.5 5.5 4.5H3v13h2.5c2.8 0 5 .8 6.5 2 1.5-1.2 3.7-2 6.5-2H21v-13h-2.5c-2.8 0-5 .8-6.5 2ZM12 6.5v13"/></svg></span>
                    <h2>Área de Estudos</h2>
                    <p>Acesse materiais didáticos por tema.</p>
                    <span class="link-seta">Abrir materiais<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
                    <svg class="opcao-marca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.3 4.5 5.5 4.5H3v13h2.5c2.8 0 5 .8 6.5 2 1.5-1.2 3.7-2 6.5-2H21v-13h-2.5c-2.8 0-5 .8-6.5 2ZM12 6.5v13"/></svg>
                </a>

                <a class="card atalho" href="historico.html">
                    <span class="icone-caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M5 3 2 6M19 3l3 3"/></svg></span>
                    <span class="atalho-texto"><strong>Meu Histórico</strong><span>Veja suas atividades realizadas.</span></span>
                    <svg class="atalho-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </a>

                <a class="card atalho" href="certificado.html" id="opcao-certificados">
                    <span class="icone-caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 9h6M7 12h4"/><circle cx="16.5" cy="13" r="2.2"/><path d="m15.3 15-.8 4 2-1 2 1-.8-4"/></svg></span>
                    <span class="atalho-texto"><strong>Certificados</strong><span id="certificados-descricao">Visualize e valide seus certificados.</span></span>
                    <svg class="atalho-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                </a>
            </div>
        </main>
    </div>

    <script src="../Scripts/comum.js"></script>
    <script src="../Scripts/menu.js"></script>
</body>
</html>
