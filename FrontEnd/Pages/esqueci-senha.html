<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha | MultiCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/acesso.css">
</head>
<body>
    <div class="acesso-centro">
        <a class="marca" href="inicial.html"><img src="../../assets/logo-icone.svg" alt=""><span class="marca-texto">Multi<span>Core</span></span></a>

        <main class="card cartao-centro formulario" aria-labelledby="titulo">
            <a class="voltar-link" href="login.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                Voltar ao login
            </a>
            <div class="icone-caixa" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.4 12.6 9.6-9.6M17 6l2.5 2.5M14.5 8.5 16.5 10.5"/></svg>
            </div>
            <h1 id="titulo">Esqueceu sua senha?</h1>
            <p class="subtitulo">Informe seu CPF e o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>

            <form id="form-recuperar" novalidate>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <div class="campo-entrada">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="username" aria-describedby="erro-cpf" required>
                    </div>
                    <p class="campo-erro" id="erro-cpf" aria-live="polite"></p>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="campo-entrada">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" aria-describedby="erro-email" required>
                    </div>
                    <p class="campo-erro" id="erro-email" aria-live="polite"></p>
                </div>

                <!-- Ainda não há serviço de e-mail: a tela avisa em vez de fingir o envio -->
                <p class="aviso aviso-info" id="aviso-recuperar" role="status" hidden>
                    A recuperação de senha por e-mail ainda não está disponível. Procure a coordenação do curso para redefinir sua senha.
                </p>

                <button type="submit" class="btn btn-primario btn-bloco">Enviar link de recuperação</button>
            </form>
        </main>
    </div>

    <script src="../Scripts/comum.js"></script>
    <script src="../Scripts/esqueci-senha.js"></script>
</body>
</html>
