<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Style/login.css">
</head>
<body>
    <div class="bg-glow top-right"></div>
    <div class="bg-glow bottom-left"></div>

    <main class="container">
        <div class="logo-container">
            <div class="logo-circle">
                <span class="logo-cap">∞</span>
                <span class="logo-icon">✦</span>
            </div>
            <div class="logo-text">Multicore</div>
        </div>

        <section class="card-screen">
            <h1>Acesse sua conta</h1>
            <p class="subtitle">Entre com seu CPF e senha para continuar.</p>

            <div id="alert-box" class="alert error" style="display: none;">
                Sua sessão expirou. Por favor, faça login novamente.
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🪪</span>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
                        <span id="toggle-password" class="toggle-password" aria-label="Mostrar senha">👁</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <p class="signup-text">
                Não possui uma conta?
                <button type="button" id="btn-cadastrar" class="link-button">Cadastre-se</button>
            </p>

            <p class="footer-link">
                <a href="inicial.html">Voltar para o início</a>
            </p>
        </section>
    </main>

    <script src="../Script/login.js"></script>
</body>
</html>
